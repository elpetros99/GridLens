[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "batched-powerflow"
version = "0.2.0"
description = "GPU-ready batched AC power-flow and explainable N-k security analysis for pandapower networks."
readme = "README.md"
authors = [{name = "elpetros99"}]
license = {file = "LICENSE"}
keywords = ["power systems", "power flow", "contingency analysis", "N-1", "N-2", "JAX", "pandapower"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
requires-python = ">=3.10"
dependencies = [
    "jax>=0.4.35",
    "jaxlib>=0.4.35",
    "numpy>=2.0",
    "scipy>=1.13",
    "pandas>=2.2",
    "pandapower>=3.2",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/elpetros99/GridLens"
Repository = "https://github.com/elpetros99/GridLens"
Issues = "https://github.com/elpetros99/GridLens/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
