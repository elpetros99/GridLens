<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-labelledby="title desc">
  <title id="title">GridLens Diagnostics logo</title>
  <desc id="desc">A stylized electrical grid and magnifying lens with voltage and frequency waveforms.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06171f"/>
      <stop offset="48%" stop-color="#0c2c35"/>
      <stop offset="100%" stop-color="#113b35"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7ee7c6"/>
      <stop offset="55%" stop-color="#30b8d4"/>
      <stop offset="100%" stop-color="#f3c969"/>
    </linearGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="960" height="300" rx="34" fill="url(#bg)"/>
  <path d="M40 230 C130 160, 210 245, 300 170 S470 145, 560 205 S720 245, 920 115" fill="none" stroke="#174e54" stroke-width="30" stroke-linecap="round" opacity="0.45"/>
  <g transform="translate(80 48)">
    <g stroke="#7ee7c6" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0.95">
      <path d="M30 135 H86 L130 83 H195 L250 135 H310"/>
      <path d="M130 83 L130 185"/>
      <path d="M195 83 L195 185"/>
      <path d="M86 135 L130 185 H195 L250 135"/>
    </g>
    <g fill="#f3c969" filter="url(#softGlow)">
      <circle cx="30" cy="135" r="10"/>
      <circle cx="130" cy="83" r="10"/>
      <circle cx="195" cy="83" r="10"/>
      <circle cx="310" cy="135" r="10"/>
      <circle cx="130" cy="185" r="8"/>
      <circle cx="195" cy="185" r="8"/>
    </g>
    <g transform="translate(238 26)">
      <circle cx="74" cy="74" r="58" fill="none" stroke="url(#accent)" stroke-width="12"/>
      <path d="M118 118 L168 168" stroke="#f3c969" stroke-width="16" stroke-linecap="round"/>
      <path d="M30 78 C46 46, 66 108, 84 78 S122 78, 132 60" fill="none" stroke="#30b8d4" stroke-width="7" stroke-linecap="round"/>
    </g>
  </g>
  <g transform="translate(495 84)">
    <text x="0" y="0" fill="#ecfff8" font-family="Aptos Display, Segoe UI, Arial, sans-serif" font-size="64" font-weight="800" letter-spacing="-1.8">GridLens</text>
    <text x="3" y="48" fill="#a9cfc6" font-family="Aptos, Segoe UI, Arial, sans-serif" font-size="24" font-weight="600" letter-spacing="2.5">DIAGNOSTIC SECURITY ANALYSIS</text>
    <path d="M4 82 H350" stroke="url(#accent)" stroke-width="4" stroke-linecap="round"/>
    <text x="3" y="124" fill="#d8efe9" font-family="Aptos, Segoe UI, Arial, sans-serif" font-size="22">Explainable N-k screening, AC validation,</text>
    <text x="3" y="153" fill="#d8efe9" font-family="Aptos, Segoe UI, Arial, sans-serif" font-size="22">and voltage/frequency stability indicators.</text>
  </g>
</svg>
